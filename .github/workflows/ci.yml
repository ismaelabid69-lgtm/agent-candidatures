name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 1er job : qualité du code et tests
  qualite:
    name: Lint + tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Vérifier le style du code (ruff)
        run: ruff check .

      - name: Lancer les tests (pytest)
        run: pytest -v

  # 2e job : construire l'image Docker et vérifier que l'API démarre
  docker:
    name: Build + test de l'image Docker
    runs-on: ubuntu-latest
    needs: qualite              # ne se lance que si les tests sont verts
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image
        run: docker build -t agent-candidatures:ci .

      - name: Démarrer le conteneur
        run: |
          mkdir -p donnees && chmod 777 donnees
          docker run -d --name agent -p 8000:8000 -v "$PWD/donnees:/data" \
            -e PLANIFICATION=off agent-candidatures:ci

      - name: Attendre que le conteneur soit "healthy"
        run: |
          for i in $(seq 1 30); do
            etat=$(docker inspect -f '{{.State.Health.Status}}' agent)
            echo "Essai $i : $etat"
            [ "$etat" = "healthy" ] && exit 0
            sleep 2
          done
          docker logs agent
          exit 1

      - name: Tester l'API
        run: |
          curl -sf http://127.0.0.1:8000/sante
          curl -sf http://127.0.0.1:8000/stats
          curl -sf http://127.0.0.1:8000/openapi.json > /dev/null

      - name: Journaux du conteneur
        if: always()
        run: docker logs agent
